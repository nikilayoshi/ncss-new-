<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Passes • 20 QR Codes per A4 Sheet</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0f172a;
      padding: 20px;
    }

    .no-print {
      max-width: 900px;
      margin: 0 auto 20px auto;
      background: #1e293b;
      padding: 14px 20px;
      border-radius: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-print {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-back {
      background: #334155;
      color: #cbd5e1;
      font-size: 13px;
      padding: 9px 15px;
      border-radius: 8px;
      text-decoration: none;
    }

    /* A4 Sheet (20 QR Tokens: 4 columns x 5 rows) */
    .sheet-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      padding: 8mm;
      background: #ffffff;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 3mm;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    /* 1 QR Token */
    .qr-token {
      border: 1px dashed #94a3b8;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      background: #ffffff;
    }

    .qr-token .hdr {
      font-size: 7.5px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #334155;
      text-transform: uppercase;
    }

    .qr-canvas-box {
      width: 86px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-canvas-box canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .code-pill {
      background: #e2e8f0;
      color: #0f172a;
      font-family: monospace;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .sub-ftr {
      font-size: 6.5px;
      color: #94a3b8;
      font-style: italic;
    }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .sheet-container { gap: 0 !important; }
      .page { margin: 0 !important; box-shadow: none !important; }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div>
      <h3 style="font-size: 15px; font-weight: 800; color: #38bdf8;">Print Pure QR Tokens (20 per A4 Page)</h3>
      <p style="font-size: 11px; color: #94a3b8;" id="status-txt">Generating 400 QR codes across 20 A4 pages...</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="/" class="btn-back">← Admin Dashboard</a>
      <button onclick="window.print()" class="btn-print">🖨️ Print / Save to PDF</button>
    </div>
  </div>

  <div class="sheet-container" id="container"></div>

  <script>
    const TOTAL = 400;
    const PER_PAGE = 20;
    const PREFIX = 'SCI-';

    function init() {
      const container = document.getElementById('container');
      const pages = Math.ceil(TOTAL / PER_PAGE);

      let cur = 1;
      for (let p = 1; p <= pages; p++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        for (let b = 0; b < PER_PAGE && cur <= TOTAL; b++) {
          const code = `${PREFIX}${String(cur).padStart(4, '0')}`;
          const token = document.createElement('div');
          token.className = 'qr-token';
          token.innerHTML = `
            <div class="hdr">SCIENCE DAY 2026</div>
            <div class="qr-canvas-box">
              <canvas id="qr-${code}"></canvas>
            </div>
            <div class="code-pill">${code}</div>
            <div class="sub-ftr">Student Pass</div>
          `;
          pageDiv.appendChild(token);
          cur++;
        }
        container.appendChild(pageDiv);
      }

      // Render QRs
      for (let i = 1; i <= TOTAL; i++) {
        const code = `${PREFIX}${String(i).padStart(4, '0')}`;
        const canvas = document.getElementById(`qr-${code}`);
        if (canvas && window.QRCode) {
          QRCode.toCanvas(canvas, code, {
            width: 86,
            margin: 0,
            color: { dark: '#000000', light: '#ffffff' }
          });
        }
      }
    }

    window.onload = init;
  </script>
</body>
</html>
